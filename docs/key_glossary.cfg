# ======================================================================================================
# KEY GLOSSARY: every key a RIPPS2 theme can use, as of RIPPS2 build 98 (10/12/2026).
# Full detail: docs/THEME_KEYS.md (RIPPS2's keys) and docs/THEME_ENGINE_RiptOPL.md (the engine under it),
# github.com/akilluminati47/RIPPS2-themes. Lines starting with # are comments: the engine skips them.
# A key the engine does not know is ignored, silently. "B" is the RIPPS2 build a key arrived in (OPL =
# from OPL / RiptOPL); an older build ignores a newer key, so a theme stays usable on it.
# ======================================================================================================
#
# ---- FILE LAYOUT -------------------------------------------------------------------------------------
#   key=value        a global key: no indent, above the first element block
#   main0:           an element block; its keys follow, one per line, indented with a tab
#   Families: main / info (the game list / its info page), appsMain / appsInfo, favsMain / favsInfo,
#   vcdMain / vcdInfo, favsVcdMain / favsVcdInfo, favsAppsMain / favsAppsInfo. main and info count 0, 1,
#   2... with no gap (the engine stops at the first missing number); every other family replaces its
#   base family's element of the same number. Elements draw in the order they are declared.
# ---- COORDINATES -------------------------------------------------------------------------------------
#   A 640 x 480 space, scaled to the video mode (480p, 720p and 1080i included). Negative x / y count
#   from the right / bottom. POS_MID: the centre. DIM_INF: the whole width or height.
#
# ---- GLOBAL KEYS -------------------------------------------- B ---- values: what it does -------------
#   bg_color                                                   OPL    #RRGGBB: the page behind everything
#   text_color / ui_text_color / sel_text_color / title_color  OPL    #RRGGBB: text, menu text, the
#                                                                     selection (the Grid's glow too), titles
#   default_font, font1 ... font15                             OPL/59 a .ttf in the folder, or builtin:
#   default_font_size, font1_size ... font15_size              OPL    pixels
#   font1_caps ... font15_caps (default_font_caps)             70     1: that font in capitals
#   towers                                                     78     0: no pillars on the game pages
#   bg_blur                                                    98     off weak normal strong: how hard
#                                                                     frosted glass blurs the art (strong)
#   use_settings_bg                                            OPL    1 + settings_bg.png: Settings over it
#   use_default                                                OPL    0: no fallback to RIPPS2's own images
#   use_real_height                                            OPL    1: lay out against the real height
#   coverflow_cover_offset                                     OPL    -1024..1024: Coverflow's nudge
#
# ---- COLORS AND MORE, THE THEME'S DEFAULTS (the user's own choice always wins) ------------------------
#   color_theme       81  ripps2 ember blood ectoplasm amethyst bone: one colour matrix over RIPPS2's own
#   category_bar      81  shown fade hidden: LAUNCH DISC / STORAGE / MEMORY FILES along the top
#   button_hints      81  shown fade hidden: the hint row
#   dpad_glyphs       81  hidden shown fade_in fade_out: the D-pad glyphs beside a drive's name
#   category_order    81  launch_disc_first memory_files_first
#   source_name       80  pop shown fade hidden: the source's name (pop: a toast in big capitals)
#   page_buttons      96  l2r2 l1r1: which shoulder pair turns the list's pages (the other switches tabs)
#
# ---- HINTS AND GLYPHS (90) ---------------------------------------------------------------------------
#   hints_hide        hint names, comma separated: left off the bar (the buttons still work)
#   hints_order       hint names, comma separated: these first, in this order
#   hints_labels      1 (default), 0 (glyphs only), badge (glyph and title on one pill, hint_badge.png)
#   hints_layout      row (default), column (one hint a line from the hint element's x / y down)
#   hints_spacing     12..96 (28): a column's line pitch
#   glyph_set         theme (the folder's PNGs), ripps2, standard, white
#   Hint names: menu run info options refresh star view source (or by button: start select r3 l3 cross
#   circle square triangle).
#
# ---- THE CATEGORY BAR (92) ---------------------------------------------------------------------------
#   category_font                ripps2 (default), theme (font2 for the current tab, font7 the others)
#   category_layout              row (default), column (stacked down the side)
#   category_x, category_y       a column's left edge and first line (40, 140); in a row, y moves the bar
#   category_spacing             12..120 (34): a column's pitch
#   category_label_launch / category_label_storage / category_label_files    the words on the bar
#   category_transition          none fade flash: how a new tab's page comes in
#
# ---- THE LAUNCH DISC (91) ----------------------------------------------------------------------------
#   launch_disc       pop spin: the game's disc comes in as it launches (its ICO art, else launch_disc.png)
#
# ---- FONTS -------------------------------------------------------------------------------------------
#   builtin: ripps2 (RIPPS2's text face), ripps2sleek, ripps2sleekbold, ripps2sleekcase (true lowercase),
#   ripflow (Roboto Condensed), ripflowbold (Roboto Bold Condensed). Nothing to ship for these.
#   Slots RIPPS2's own pages draw with: font2 the current tab, font3 Launch Disc's line, font4 the menus
#   and message boxes, font5 small text, font6 text beside a glyph, font7 the other tabs, font8 Memory
#   Files rows, font9 true-case titles, font10 About's small print, font11 the CD player's title, font14
#   big numbers (RIPPS2 Sleek Bold 64 when unset), font15 typed text. A slot left out uses default_font.
#   From build 96 Settings and its dialogs read in one plain face (Roboto Condensed) on every theme.
#
# ---- ELEMENT TYPES (type=) ---------------------------------------------------------------------------
#   Background        full-screen art (pattern=BG) or a default= image          OPL
#   StaticImage       a fixed image (default=)                                   OPL
#   StaticText        fixed text (value=)                                        OPL
#   AttributeText     a game's metadata text (attribute=)                        OPL
#   AttributeImage    a badge picked by a game's metadata (attribute=)           OPL
#   GameImage         a game's art (pattern=), default= when it has none         OPL
#   GameCountText     how many items the list has                                OPL
#   MenuIcon          the page's device icon                                     OPL
#   MenuText          the page's name                                            OPL
#   ItemsList         the game list (added for you if left out)                  OPL
#   ItemIcon          the chosen game's disc art (ICO)                           OPL
#   ItemCover         the chosen game's cover, with an overlay                   OPL
#   ItemText          the chosen game's startup file                             OPL
#   HintText          the list's button hints                                    OPL
#   InfoHintText      the info page's button hints                               OPL
#   LoadingIcon       the loading spinner                                        OPL
#   BdmIndex          the block-device mode marker                               OPL
#   Coverflow         a cover carousel (RIPFLOW)                                 RiptOPL
#   Ripps2PanelGlass  a glass panel: gradient, clear (tint=) or frosted (blur=1) 55 / 78 / 79
#   Grid              the list as pages of covers in rows                        78
#   A Grid or Coverflow page also declares an ItemsList with hidden=1.
#
# ---- KEYS ON ANY ELEMENT -----------------------------------------------------------------------------
#   type, x, y, width, height       OPL  where and how big (int, POS_MID, DIM_INF)
#   aligned                         OPL  0 top-left at x,y; 1 centred on x,y; 2 right-justified
#   scaled                          OPL  1: keeps its shape on 16:9 (covers, cases, screenshots)
#   color, font                     OPL  #RRGGBB; a font slot 0..15
#   enabled                         OPL  0: skip the element, keep the block
#   devices                         OPL  only on these pages: usb ilink mx4sio hdd_bd hdd eth smb mmce
#                                        udpbd udpfs app fav bdm (MenuIcon, ItemsList, HintText)
#   tilt, tilt_x, tilt_y, tilt_scale 70  1: tips with the right stick; the pivot (elements sharing one
#                                        tip as one sheet); the angle, 1..400 percent
#
# ---- IMAGE KEYS --------------------------------------------------------------------------------------
#   default         OPL  the image: a file in the folder or a built-in name (cover, disc, screen, case...)
#   pattern         OPL  the game art: COV COV2 BG SCR SCR2 ICO LGO ... (ART/<id>_<pattern>.png or .jpg)
#   count           OPL  cache slots for the pattern (2 or more for COV)
#   overlay, overlay2                                     OPL  a frame over the art, and a second over it
#   overlay_ulx _uly _urx _ury _llx _lly _lrx _lry        OPL  the art's four corners inside the overlay
#   reflection, reflection_offset                         OPL  a fading mirror below; how far down
#   alpha           66   GameImage: opacity 0..128
#   slide           59   GameImage: slideshow place 1..4 (5 s each, 1 s crossfade)
#   widecrop        79   Background: 1 zooms 4:3 art on 16:9 instead of stretching it
#
# ---- TEXT KEYS ---------------------------------------------------------------------------------------
#   value           OPL  StaticText's words
#   attribute       OPL  AttributeText: Title Developer Description Genre Release #Size
#                        AttributeImage: Rating Players Scan Vmode Aspect Parental #System #Media
#                        #Format #DiscType (a theme file is <value>_<attribute>.png)
#   display         OPL  0 label and value, 1 only when there is a value, 2 the value alone
#   wrap            OPL  1: word wrap inside width / height
#   title           OPL  AttributeText: its own label
#   show_run        OPL  InfoHintText: 0 hides the Run hint
#   line_height, vcenter  59  wrapped text's line step; centre the block. Either one makes long text roll
#
# ---- LIST KEYS ---------------------------------------------------------------------------------------
#   decorator       OPL  ItemsList: a pattern drawn as each row's icon (ICO)
#   item_height     59   ItemsList: the row pitch
#   hidden          OPL  ItemsList: 1 drives the selection without drawing (Grid, Coverflow)
#
# ---- Ripps2PanelGlass --------------------------------------------------------------------------------
#   blur            78   1: frosted, the page's Background softened behind it
#   tint            79   0..128: one even tint (clear glass) instead of the gradient
#   tint_color      79   #RRGGBB (#040C2E): the tint's colour
#   frame           79   0: no frame line. The first framed panel of main and of info morph into each other
#
# ---- Grid --------------------------------------------------------------------------------------------
#   x, y, width, height   the grid's centre (POS_MID), its top (60), one cover (104 x 146)
#   columns 1..8 (4), rows 1..4 (2), spacing (14)          78
#   back_pattern          82   the back of a turned case (COV2); 0: cases do not turn
#   coverless             92   title (default), serial: what a game with no cover shows on its case
#   title, title_y, title_font   92   1: the chosen game's name under the grid; its line (418); its font
#   wide_columns, wide_rows, wide_width, wide_height, wide_spacing   98   the page on a 16:9 picture only
#                         (widescreen, 720p, 1080i); each one left out is the standard one
#   overlay, overlay_*, reflection, font, tilt*: as above (tilt tips only the chosen cover)
#   On the console: Right on a row's last cover and L2 / R2 turn the page (97, 98); a 0.42 s hold turns the
#   chosen case over (97, RIPFLOW's centre cover too); Circle cycles the sources.
#
# ---- RIPPS2'S OWN IMAGES, REPLACED BY NAME (ship <name>.png, 8-bit palette) ---------------------------
#   glyphs: cross circle square triangle select start L1 R1 L3 R3 L2R2 left right ripps2_up ripps2_down
#           hint_badge     loading: load0 ... load7     launch: launch_disc
#   devices: usb usb_bd ilk_bd m4s_bd hdd_bd hdd mmce eth udp_bd udp_fs app Index_0 ... Index_4
#   badges: ELF HDL ISO VCD ZSO UL APP CD DVD PS1 PS2, Aspect_*, Rating_*, Scan_*, Vmode_*
#   art: cover disc screen screens coverapp missing case case_overlay apps_case logo logo0 ... logo6 fav
#        fav_mark settings_bg     marks: ripps2_mark ripps2_mark_glow ripps2_glass ripps2_ps1logo
#        ripps2_ps2logo ripps2_grid_icons ra_mark
#
# ---- SOUND -------------------------------------------------------------------------------------------
#   sound/<event>.adp: boot cursor confirm cancel message transition bd_connect bd_disconnect page_in
#   page_out error save launch disc random. sound/bgm.ogg: the theme's music. RIPPS2 has no sounds of
#   its own (build 95); from build 98 an event the theme leaves out plays the user's AUDIO folder sound.
# ======================================================================================================
